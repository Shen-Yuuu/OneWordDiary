<!DOCTYPE html>

<header class="flex justify-between items-center px-margin-horizontal h-16 shrink-0 z-10">
<button aria-label="关闭预览" class="w-10 h-10 flex items-center justify-center text-primary rounded-full hover:bg-surface-dim transition-colors">

</button>
<div class="font-label-caps text-label-caps text-on-surface-variant">

            </div>

</header>

<div class="flex-1 overflow-y-auto px-margin-horizontal pb-[140px] pt-4 flex flex-col items-center">

<div class="bg-surface w-full max-w-[400px] rounded-lg paper-shadow py-12 px-8 flex flex-col items-center relative">

<div class="mb-16 text-center">
<h2 class="font-date-numeral text-date-numeral text-outline tracking-[0.2em] uppercase">
                        Recent 7 Days
                    </h2>
<div class="w-4 h-[1px] bg-outline-variant mx-auto mt-4"></div>
</div>

<div class="flex flex-col w-full gap-section-gap relative"><!-- Central Axis -->
<div class="absolute left-1/2 top-4 bottom-4 w-[1px] bg-outline-variant/30 -translate-x-1/2 -z-0"></div>
<!-- Day 17 (Right Side) -->
<div class="flex items-center relative z-10 w-full">
<div class="w-1/2 pr-gutter text-right">
<div class="font-date-numeral text-[10px] text-outline uppercase">17日 星期一</div>
</div>
<div class="w-0 flex justify-center items-center">
<div class="w-2 h-2 rounded-full bg-primary shrink-0"></div>
</div>
<div class="w-1/2 pl-gutter">
<div class="font-display-word text-display-word text-primary leading-none">静</div>
</div>
</div>
<!-- Day 16 (Empty - Centered) -->
<div class="flex items-center relative z-10 w-full h-12">
<div class="w-1/2 pr-gutter text-right">
<div class="font-date-numeral text-[10px] text-outline-variant uppercase">16日 星期日</div>
</div>

<div class="w-4 h-4 rounded-full border border-outline-variant bg-surface shrink-0"></div>
</div>
<div class="w-1/2"></div>
</div>

<div class="flex items-center relative z-10 w-full">

<div class="w-2 h-2 rounded-full bg-primary shrink-0"></div>
</div>
<div class="w-1/2 pl-gutter">

</div>
</div>

<div class="flex items-center relative z-10 w-full h-12">
<div class="w-1/2 pr-gutter text-right">
<div class="font-date-numeral text-[10px] text-outline-variant uppercase">14日 星期五</div>
</div>
<div class="w-0 flex justify-center items-center">
<div class="w-4 h-4 rounded-full border border-outline-variant bg-surface shrink-0"></div>

</div>

<div class="w-1/2 pr-gutter text-right">

<div class="w-2 h-2 rounded-full bg-primary shrink-0"></div>
</div>
<div class="w-1/2 pl-gutter">
<div class="font-display-word text-display-word text-primary leading-none">远</div>

</div>

<div class="w-2 h-2 rounded-full bg-primary shrink-0"></div>
</div>

</div>

</div>

</div>

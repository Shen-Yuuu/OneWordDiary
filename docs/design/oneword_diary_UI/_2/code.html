<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>确认层设计 - 现代东方留白</title>
<!-- Google Fonts & Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&amp;family=Noto+Serif+SC:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-low": "#f7f3f1",
              "secondary-fixed-dim": "#cdc5bb",
              "on-surface-variant": "#4a463f",
              "outline-variant": "#ccc6bc",
              "surface-dim": "#ddd9d8",
              "on-tertiary": "#ffffff",
              "on-primary-fixed-variant": "#494642",
              "surface-variant": "#e6e2e0",
              "on-secondary": "#ffffff",
              "inverse-surface": "#31302f",
              "surface-container-high": "#ebe7e6",
              "secondary": "#635e55",
              "on-primary-container": "#918d87",
              "on-error": "#ffffff",
              "surface-container-highest": "#e6e2e0",
              "background": "#fdf8f7",
              "outline": "#7b776e",
              "on-tertiary-container": "#c87867",
              "on-surface": "#1c1b1b",
              "on-tertiary-fixed-variant": "#733427",
              "primary-fixed-dim": "#cbc6bf",
              "primary": "#13110e",
              "on-secondary-fixed-variant": "#4b463e",
              "inverse-on-surface": "#f4f0ee",
              "surface": "#fdf8f7",
              "on-tertiary-fixed": "#3b0903",
              "on-primary-fixed": "#1d1b18",
              "on-error-container": "#93000a",
              "surface-bright": "#fdf8f7",
              "error-container": "#ffdad6",
              "inverse-primary": "#cbc6bf",
              "on-background": "#1c1b1b",
              "tertiary-fixed": "#ffdad3",
              "primary-fixed": "#e7e2db",
              "surface-tint": "#615e59",
              "error": "#ba1a1a",
              "surface-container-lowest": "#ffffff",
              "secondary-fixed": "#eae1d6",
              "tertiary-fixed-dim": "#ffb4a5",
              "on-secondary-container": "#69645b",
              "secondary-container": "#eae1d6",
              "tertiary": "#2c0200",
              "on-primary": "#ffffff",
              "on-secondary-fixed": "#1f1b14",
              "surface-container": "#f1edec",
              "tertiary-container": "#49140a",
              "primary-container": "#282622"
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            spacing: {
              "margin-horizontal": "24px",
              "section-gap": "40px",
              "base": "8px",
              "gutter": "16px"
            },
            fontFamily: {
              "label-caps": ["Noto Sans SC"],
              "headline-lg-mobile": ["Noto Serif SC"],
              "display-word": ["Noto Serif SC"],
              "headline-lg": ["Noto Serif SC"],
              "body-md": ["Noto Sans SC"],
              "date-numeral": ["Noto Sans SC"]
            },
            fontSize: {
              "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.1em", fontWeight: "500" }],
              "headline-lg-mobile": ["22px", { lineHeight: "30px", fontWeight: "500" }],
              "display-word": ["48px", { lineHeight: "64px", letterSpacing: "-0.02em", fontWeight: "500" }],
              "headline-lg": ["24px", { lineHeight: "32px", letterSpacing: "0em", fontWeight: "500" }],
              "body-md": ["16px", { lineHeight: "28px", letterSpacing: "0.01em", fontWeight: "400" }],
              "date-numeral": ["14px", { lineHeight: "20px", letterSpacing: "0.05em", fontWeight: "300" }]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        /* Paper grain texture */
        .paper-grain {
            position: relative;
        }
        .paper-grain::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="bg-surface-container-low text-on-surface antialiased paper-grain min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Simulated Underlying Page Content (Blurred/Dimmed) -->
<div class="absolute inset-0 z-0 flex flex-col items-center pt-32 px-margin-horizontal opacity-30 select-none pointer-events-none filter blur-sm transition-all duration-1000">
<div class="w-full max-w-[600px] space-y-8">
<div class="h-6 w-32 bg-outline-variant rounded-sm mx-auto"></div>
<div class="space-y-4">
<div class="h-4 w-full bg-outline-variant rounded-sm"></div>
<div class="h-4 w-5/6 bg-outline-variant rounded-sm"></div>
<div class="h-4 w-4/6 bg-outline-variant rounded-sm"></div>
</div>
</div>
</div>
<!-- Translucent Warm-White Overlay Layer -->
<div class="absolute inset-0 z-10 bg-surface/85 backdrop-blur-md"></div>
<!-- Main Container for Confirmation States -->
<main class="relative z-20 w-full max-w-[900px] px-margin-horizontal mx-auto">
<!-- Header to explain the view (Not part of the actual component, just for presentation) -->
<header class="text-center mb-16 md:mb-24">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-widest opacity-80">状态预览</h1>
</header>
<!-- Components Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-section-gap md:gap-24 items-center">
<!-- State 1: 落字确认 (Write Entry Confirmation) -->
<section class="flex flex-col items-center justify-center p-8 transition-transform hover:-translate-y-1 duration-500">
<!-- Inner Paper Canvas -->
<div class="flex flex-col items-center space-y-10 w-full max-w-[320px]">
<!-- Decorative Element -->
<div class="flex flex-col items-center space-y-4">
<div class="w-1.5 h-1.5 rounded-full bg-on-tertiary-container"></div>
<span class="font-date-numeral text-date-numeral text-secondary uppercase tracking-widest">2023.10.24</span>
</div>
<!-- Core Identity -->
<div class="text-center space-y-4">
<h2 class="font-display-word text-display-word text-primary leading-none">静</h2>
<p class="font-body-md text-body-md text-secondary opacity-80 max-w-[200px] mx-auto">
                            墨迹已干，心境亦然。
                        </p>
</div>
<!-- Actions -->
<div class="w-full space-y-4 pt-4">
<button class="w-full py-4 bg-primary text-on-primary font-label-caps text-label-caps tracking-widest hover:opacity-90 transition-opacity flex items-center justify-center group">
                            收入长卷
                            <span class="material-symbols-outlined ml-2 text-[16px] group-hover:translate-x-1 transition-transform">arrow_right_alt</span>
</button>
<button class="w-full py-4 border border-outline-variant text-secondary font-label-caps text-label-caps tracking-widest hover:bg-surface-variant transition-colors">
                            再想想
                        </button>
</div>
</div>
</section>
<!-- State 2: 留白确认 (Leave Blank Confirmation) -->
<section class="flex flex-col items-center justify-center p-8 transition-transform hover:-translate-y-1 duration-500">
<!-- Inner Paper Canvas -->
<div class="flex flex-col items-center space-y-10 w-full max-w-[320px]">
<!-- Decorative Element (Empty state variation) -->
<div class="flex flex-col items-center space-y-4">
<div class="w-1.5 h-1.5 rounded-full border border-on-tertiary-container"></div>
<span class="font-date-numeral text-date-numeral text-secondary uppercase tracking-widest">2023.10.24</span>
</div>
<!-- Core Identity -->
<div class="text-center space-y-4 h-[100px] flex items-center justify-center">
<h2 class="font-headline-lg text-headline-lg text-primary tracking-[0.2em] ml-[0.2em]">把今天留给空白</h2>
</div>
<!-- Actions -->
<div class="w-full space-y-4 pt-4">
<button class="w-full py-4 bg-primary text-on-primary font-label-caps text-label-caps tracking-widest hover:opacity-90 transition-opacity flex items-center justify-center group">
                            确认留白
                            <span class="material-symbols-outlined ml-2 text-[16px] group-hover:translate-x-1 transition-transform">done</span>
</button>
<button class="w-full py-4 border border-outline-variant text-secondary font-label-caps text-label-caps tracking-widest hover:bg-surface-variant transition-colors">
                            再想想
                        </button>
</div>
</div>
</section>
</div>
</main>
</body></html>

<!DOCTYPE html><html lang="zh" style=""><head>
<meta charset="utf-8">

<title>文字长卷</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",

                extend: {
                    "colors": {
                        "surface-bright": "#fdf8f7",

                        "on-surface": "#1c1b1b",
                        "on-primary-container": "#918d87",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#c87867",
                        "on-secondary-container": "#69645b",
                        "on-tertiary-fixed": "#3b0903",
                        "secondary": "#635e55",
                        "on-background": "#1c1b1b",
                        "on-surface-variant": "#4a463f",
                        "surface-container-low": "#f7f3f1",
                        "primary-fixed-dim": "#cbc6bf",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#cbc6bf",
                        "outline": "#7b776e",
                        "on-primary-fixed-variant": "#494642",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "primary-container": "#282622",
                        "on-secondary-fixed": "#1f1b14",
                        "surface-container": "#f1edec",
                        "inverse-surface": "#31302f",
                        "primary": "#13110e",
                        "error": "#ba1a1a",
                        "background": "#fdf8f7",
                        "secondary-container": "#eae1d6",
                        "surface-container-highest": "#e6e2e0",
                        "on-tertiary-fixed-variant": "#733427",
                        "inverse-on-surface": "#f4f0ee",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffdad3",
                        "on-secondary-fixed-variant": "#4b463e",
                        "tertiary-container": "#49140a",
                        "surface": "#fdf8f7",
                        "surface-dim": "#ddd9d8",
                        "tertiary-fixed-dim": "#ffb4a5",
                        "secondary-fixed-dim": "#cdc5bb",
                        "tertiary": "#2c0200",
                        "on-error": "#ffffff",
                        "surface-variant": "#e6e2e0",
                        "on-primary-fixed": "#1d1b18"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "gutter": "16px",
                        "section-gap": "40px",
                        "margin-horizontal": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Noto Sans SC"],
                        "headline-lg-mobile": ["Noto Serif SC"],
                        "label-caps": ["Noto Sans SC"],
                        "date-numeral": ["Noto Sans SC"],
                        "display-word": ["Noto Serif SC"],
                        "headline-lg": ["Noto Serif SC"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "28px", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "headline-lg-mobile": ["22px", { "lineHeight": "30px", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "500" }],
                        "date-numeral": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "300" }],
                        "display-word": ["48px", { "lineHeight": "64px", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "0em", "fontWeight": "500" }]

                }
            }
        }
    </script>
<style>
        .paper-grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }
        .writing-vertical {
            writing-mode: vertical-rl;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen relative overflow-x-hidden selection:bg-surface-container-high selection:text-primary">
<div class="paper-grain"></div>
<!-- Screen 5: Word Scroll -->
<div class="w-full max-w-[600px] mx-auto pb-32" id="screen5">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-transparent flex justify-between items-center px-margin-horizontal h-16 max-w-[600px] mx-auto z-40 backdrop-blur-md">
<button aria-label="Back" class="text-on-surface hover:opacity-70 transition-opacity flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 0;">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-widest">文字长卷</h1>
<button aria-label="Share" class="text-on-surface hover:opacity-70 transition-opacity flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 0;">ios_share</span>
</button>
</header>
<!-- Main Content -->
<main class="px-margin-horizontal mt-8 flex flex-col items-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-section-gap opacity-90 tracking-widest">二〇二六年八月</h2>
<div class="relative w-full flex flex-col items-center space-y-16 pb-section-gap before:content-[''] before:absolute before:left-1/2 before:-translate-x-1/2 before:top-0 before:bottom-0 before:w-[1px] before:bg-outline-variant/30 before:-z-10">
<!-- Entry 1 -->
<article class="flex flex-col items-end -translate-x-12 group cursor-pointer w-1/2 pr-8" onclick="toggleScreens()">
<div class="bg-surface px-2 py-1 mb-4">
<span class="font-date-numeral text-date-numeral text-on-surface tracking-[0.2em] font-medium">17日 星期一</span>
</div>
<div class="flex flex-col items-end">
<div class="font-display-word text-display-word text-primary group-hover:scale-105 transition-transform duration-500 ease-out">
                        静
                    </div>
<div class="text-on-surface-variant text-[10px] tracking-widest mt-2 opacity-60">风停在窗边</div>
</div>
</article>
<!-- Blank Day -->
<div class="flex flex-col items-center">
<div class="bg-surface px-2 py-1 mb-4">
<span class="font-date-numeral text-date-numeral text-on-surface-variant tracking-[0.2em]">16日 星期日</span>
</div>
<div class="w-12 h-12 rounded-full border border-outline-variant/50 flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-outline-variant/30"></div>
</div>
</div>
<!-- Entry 2 (Asymmetric layout hint via translation) -->
<article class="flex flex-col items-start translate-x-12 group cursor-pointer w-1/2 pl-8 self-end" onclick="toggleScreens()">
<div class="bg-surface px-2 py-1 mb-4">
<span class="font-date-numeral text-date-numeral text-on-surface tracking-[0.2em] font-medium">15日 星期六</span>
</div>
<div class="flex flex-col items-start">
<div class="font-display-word text-display-word text-primary group-hover:scale-105 transition-transform duration-500 ease-out">
                        雨
                    </div>
<div class="text-on-surface-variant text-[10px] tracking-widest mt-2 opacity-60">听雨落阶前</div>
</div>
</article>
<!-- Blank Day -->
<div class="flex flex-col items-center">
<div class="bg-surface px-2 py-1 mb-4">
<span class="font-date-numeral text-date-numeral text-on-surface-variant tracking-[0.2em]">14日 星期五</span>
</div>
<div class="w-12 h-12 rounded-full border border-outline-variant/50 flex items-center justify-center">
</div>
</div>
<!-- Entry 3 (Asymmetric layout hint) -->
<article class="flex flex-col items-end -translate-x-12 group cursor-pointer w-1/2 pr-8" onclick="toggleScreens()">
<div class="bg-surface px-2 py-1 mb-4">
<span class="font-date-numeral text-date-numeral text-on-surface tracking-[0.2em] font-medium">13日 星期四</span>
</div>
<div class="flex flex-col items-end">
<div class="font-display-word text-display-word text-primary group-hover:scale-105 transition-transform duration-500 ease-out">
                        远
                    </div>
<div class="text-on-surface-variant text-[10px] tracking-widest mt-2 opacity-60">山色空蒙中</div>
</div>
</article>
</div>
<button class="mt-section-gap px-8 py-3 rounded-full border border-outline-variant text-on-surface font-label-caps text-label-caps tracking-widest hover:bg-surface-container-low transition-colors flex items-center space-x-2 shadow-[0_4px_24px_rgba(40,38,34,0.05)]">
<span class="">最近七日</span>
<span class="material-symbols-outlined text-sm" style="font-variation-settings: &quot;FILL&quot; 0;">share</span>
</button>
</main>
</div>
<!-- Screen 6: Single Day Detail (Initially Hidden) -->
<div class="w-full max-w-[600px] mx-auto min-h-screen flex flex-col pb-24 hidden" id="screen6">
<!-- Top Navigation -->
<header class="w-full flex justify-between items-center px-margin-horizontal h-16 pt-4">
<button aria-label="Back" class="text-on-surface-variant hover:opacity-70 transition-opacity flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low" onclick="toggleScreens()">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 0;">arrow_back</span>
</button>
<div class="font-date-numeral text-date-numeral text-on-surface tracking-widest">
                二〇二六年八月十七日
            </div>
<div class="w-10"></div> <!-- Spacer -->
</header>
<!-- Detail Content -->
<main class="flex-1 px-margin-horizontal mt-12 flex flex-col items-center justify-center relative">
<div class="absolute top-0 right-8 w-12 h-32 border-l border-outline-variant/30 flex justify-center pt-4">
<div class="w-6 h-6 bg-[#ba3f30] flex items-center justify-center text-on-primary text-[10px] font-headline-lg shadow-sm">
                   已
               </div>
</div>
<div class="font-display-word text-[120px] leading-none text-primary mb-12 select-none" style="font-weight: 300;">
                静</div>
<div class="max-w-[80%] text-center font-body-md text-body-md text-on-surface-variant leading-loose">
                窗外细雨连绵，心境如幽潭般深邃。今日无事，宜静坐，宜听雨，宜煮一壶老茶。
            </div>
</main>
<!-- Floating Share Action -->
<div class="fixed bottom-12 left-1/2 -translate-x-1/2 z-50">
<button class="w-16 h-16 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-[0_8px_32px_rgba(40,38,34,0.15)] hover:scale-105 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: &quot;FILL&quot; 0;">ios_share</span>
</button>
</div>
</div>
<script>
        function toggleScreens() {
            const screen5 = document.getElementById('screen5');
            const screen6 = document.getElementById('screen6');

            if (screen5.classList.contains('hidden')) {
                screen5.classList.remove('hidden');
                screen6.classList.add('hidden');
                window.scrollTo(0, 0);
            } else {
                screen5.classList.add('hidden');
                screen6.classList.remove('hidden');
                window.scrollTo(0, 0);
            }
        }
    </script>
</body></html>
